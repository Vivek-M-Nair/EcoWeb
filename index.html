<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO BIN - Administrative & Operational Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            500: '#10b981', 600: '#16a34a', 700: '#15803d', 950: '#022c22'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        input:focus,
        select:focus,
        textarea:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>

<body
    class="min-h-screen font-sans antialiased text-slate-700 bg-slate-50 dark:bg-slate-950 dark:text-slate-300 selection:bg-emerald-100 dark:selection:bg-emerald-950/40 transition-colors duration-300 relative flex flex-col justify-between"
    x-data="portalApp()" x-init="initPortal()" x-cloak>

    <!-- Glowing Background blobs -->
    <div
        class="absolute top-0 right-0 -z-10 pointer-events-none w-96 h-96 bg-emerald-50/50 dark:bg-emerald-950/10 rounded-full blur-3xl">
    </div>
    <div
        class="absolute bottom-0 left-0 -z-10 pointer-events-none w-96 h-96 bg-emerald-50/30 dark:bg-emerald-955/20 rounded-full blur-3xl">
    </div>

    <!-- Live Toast System -->
    <div x-show="toast.show" x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-2 sm:translate-y-0 sm:translate-x-2"
        x-transition:enter-end="opacity-100 translate-y-0 sm:translate-x-0"
        x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed bottom-6 right-6 z-50 text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 text-xs font-semibold tracking-wide border"
        :class="toast.type === 'error' ? 'bg-rose-600 border-rose-500' : 'bg-slate-900 border-slate-800 dark:bg-emerald-950 dark:border-emerald-800'"
        style="display: none;">
        <span class="w-2.5 h-2.5 rounded-full animate-ping"
            :class="toast.type === 'error' ? 'bg-rose-300' : 'bg-emerald-400'"></span>
        <span x-text="toast.message"></span>
    </div>

    <!-- Application Header -->
    <header
        class="py-4 px-6 md:px-12 flex items-center justify-between border-b border-emerald-50 dark:border-slate-800 bg-white/40 dark:bg-slate-900/40 backdrop-blur-md sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <div
                class="h-9 w-9 bg-emerald-600 text-white rounded-xl flex items-center justify-center font-bold text-xs tracking-tighter shadow-md shadow-emerald-600/20">
                EB
            </div>
            <div>
                <h1 class="text-xs uppercase tracking-widest font-black text-emerald-900 dark:text-emerald-400">Eco Bin
                </h1>
                <p class="text-[9px] text-emerald-600 dark:text-emerald-500 font-bold uppercase tracking-wider">Control
                    WebPortal</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Dynamic Server Configuration Cog -->
            <div
                class="flex items-center gap-1.5 px-3 py-1 bg-white dark:bg-slate-900 border border-emerald-100 dark:border-slate-800 rounded-full text-[10px] text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition cursor-pointer shadow-sm relative group">
                <svg @click="showServerConfig = !showServerConfig" class="w-3.5 h-3.5 animate-spin-slow" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="font-mono" x-text="serverUrl"></span>

                <!-- Server Input Dropdown -->
                <div x-show="showServerConfig" @click.away="showServerConfig = false"
                    class="absolute right-0 top-full mt-2 w-64 p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl space-y-2 text-left z-50">
                    <label class="block text-[9px] font-bold uppercase tracking-wider text-slate-500">API Host
                        Address</label>
                    <input type="text" x-model="serverUrl"
                        class="w-full text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2 focus:outline-none dark:text-white">
                    <button @click="showServerConfig = false; saveServerUrl()"
                        class="w-full bg-emerald-600 text-white font-bold text-[10px] py-1.5 rounded-lg hover:bg-emerald-500 uppercase tracking-wider transition">Save
                        URL</button>
                </div>
            </div>

            <!-- Dark Mode Toggle -->
            <button @click="toggleTheme()"
                class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors text-slate-500 dark:text-slate-400"
                aria-label="Toggle dark mode">
                <svg x-show="!darkMode" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707m2.828 5.657a5 5 0 1110 0 5 5 0 01-10 0z" />
                </svg>
                <svg x-show="darkMode" class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>

            <!-- Sync Indicator -->
            <div
                class="flex items-center gap-2 px-3 py-1 bg-white dark:bg-slate-900 border border-emerald-100 dark:border-slate-800 rounded-full text-[10px] text-emerald-707 dark:text-emerald-400 font-semibold shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"
                    :class="user ? 'animate-ping' : 'animate-pulse'"></span>
                <span x-text="user ? 'Session Active' : 'App Sync Connected'"></span>
            </div>
        </div>
    </header>

    <!-- Main Viewport Context -->
    <main class="flex-1 flex items-center justify-center py-10 px-4 md:px-6">

        <!-- 1. AUTHENTICATION / LOGIN PANEL -->
        <template x-if="!user">
            <div
                class="w-full max-w-md bg-white dark:bg-slate-900 border border-emerald-100 dark:border-slate-800 p-8 rounded-3xl shadow-lg space-y-6">
                <div class="space-y-3 text-center">
                    <div
                        class="mx-auto h-12 w-12 bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl flex items-center justify-center text-emerald-500 border border-emerald-100/50 dark:border-slate-800 shadow-inner">
                        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path
                                d="M12 2c5.523 0 10 4.477 10 10a10 10 0 0 1-10 10m0-20A10 10 0 0 0 2 12a10 10 0 0 0 10 10m0-20v20"
                                stroke-linecap="round" />
                            <path d="M12 12c2-3 5-4 5-4s-1 4-4 5c-3 1-5 2-5 2s1-3 4-3z" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold tracking-tight text-emerald-950 dark:text-white">ECO BIN
                            Portal</h2>
                        <p class="text-xs text-slate-400 mt-1">Please authenticate to access administrative settings.
                        </p>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label
                        class="text-[10px] font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-500">Security
                        Access Portal</label>
                    <div
                        class="grid grid-cols-2 gap-2 bg-slate-50 dark:bg-slate-800/40 p-1.5 rounded-2xl border border-slate-200/60 dark:border-slate-800">
                        <button type="button" @click="credentials.passkey = 'adm_pass'"
                            :class="credentials.passkey === 'adm_pass' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900'"
                            class="py-2 px-3 rounded-xl text-[10px] transition-all duration-150 uppercase tracking-widest font-extrabold">
                            Admin
                        </button>
                        <button type="button" @click="credentials.passkey = 'office_pass'"
                            :class="credentials.passkey === 'office_pass' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900'"
                            class="py-2 px-3 rounded-xl text-[10px] transition-all duration-150 uppercase tracking-widest font-extrabold">
                            Office Staff
                        </button>
                    </div>
                </div>

                <form @submit.prevent="submitLogin()" class="space-y-5">
                    <template x-if="errorMessage">
                        <div
                            class="bg-rose-50 dark:bg-rose-950/20 text-rose-700 dark:text-rose-400 p-3.5 rounded-xl text-xs font-semibold border border-rose-100 dark:border-rose-900/50 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-rose-500 shrink-0"></span>
                            <span x-text="errorMessage"></span>
                        </div>
                    </template>

                    <div class="space-y-1">
                        <label
                            class="text-[10px] font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-500">Security
                            Login ID</label>
                        <input type="text" required x-model="credentials.id" placeholder="Enter identification ID"
                            class="w-full bg-slate-50/50 dark:bg-slate-800/40 focus:bg-white dark:focus:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:border-emerald-400 rounded-xl px-4 py-3 text-sm focus:outline-none transition-all placeholder:text-slate-400 text-slate-900 dark:text-slate-100">
                    </div>

                    <div class="space-y-1">
                        <label
                            class="text-[10px] font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-500">Password
                            Code</label>
                        <input type="password" required x-model="credentials.password" placeholder="••••••••"
                            class="w-full bg-slate-50/50 dark:bg-slate-800/40 focus:bg-white dark:focus:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:border-emerald-400 rounded-xl px-4 py-3 text-sm focus:outline-none transition-all placeholder:text-slate-404 text-slate-900 dark:text-slate-100">
                    </div>

                    <button type="submit" :disabled="loading"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3.5 rounded-xl transition duration-150 tracking-wider uppercase flex items-center justify-center gap-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg x-show="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        <span x-text="loading ? 'Authenticating Credentials...' : 'Authenticate Portal Access'"></span>
                    </button>
                </form>

                <div class="pt-6 border-t border-emerald-100 dark:border-slate-800 text-center space-y-3">
                    <p class="text-[10px] uppercase font-bold tracking-widest text-emerald-600 dark:text-emerald-500">
                        Seeded Account Presets</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="autoFill('admin')"
                            class="border border-emerald-100/50 dark:border-slate-800 hover:border-emerald-200 bg-emerald-50/10 hover:bg-emerald-50/40 p-3 rounded-xl text-left transition group">
                            <span
                                class="text-[10px] font-bold text-emerald-905 dark:text-slate-200 group-hover:text-emerald-600 block">Admin
                                Role</span>
                            <span class="text-[9px] text-slate-400 font-mono block mt-0.5">ID: admin1 / adminpass</span>
                        </button>
                        <button @click="autoFill('staff')"
                            class="border border-emerald-100/50 dark:border-slate-800 hover:border-emerald-200 bg-emerald-50/10 hover:bg-emerald-50/40 p-3 rounded-xl text-left transition group">
                            <span
                                class="text-[10px] font-bold text-emerald-905 dark:text-slate-200 group-hover:text-emerald-600 block">Office
                                Staff</span>
                            <span class="text-[9px] text-slate-400 font-mono block mt-0.5">ID: CS-1234 /
                                staffpass</span>
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- 2. DASHBOARD VIEW (AUTHENTICATED) -->
        <template x-if="user">
            <div
                class="w-full max-w-6xl bg-white dark:bg-slate-900 border border-emerald-100 dark:border-slate-800 p-6 md:p-8 rounded-3xl shadow-sm space-y-8 animate-fadeIn">

                <!-- User Session Profile Bar -->
                <div
                    class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-slate-100 dark:border-slate-800 gap-4">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full"
                                :class="user.role === 'ADMIN' ? 'bg-amber-50 dark:bg-amber-950/45 text-amber-800 dark:text-amber-400 border border-amber-100 dark:border-amber-900/50' : 'bg-emerald-50 dark:bg-emerald-950/45 text-emerald-800 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-900/50'"
                                x-text="user.role === 'ADMIN' ? 'Administrator' : 'Office Staff'"></span>
                        </div>
                        <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white mt-1.5" x-text="user.name">
                        </h2>
                    </div>

                    <button @click="logout()"
                        class="text-xs font-bold text-slate-700 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 transition bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-750 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 self-start sm:self-center">Sign
                        Out Portal</button>
                </div>

                <!-- A. ADMINISTRATIVE ACCOUNT COMPONENT -->
                <template x-if="user.role === 'ADMIN'">
                    <div class="space-y-8" x-data="adminDashboard()" x-init="initAdmin()">

                        <!-- Admin Tabs Navigation -->
                        <div
                            class="flex border-b border-slate-100 dark:border-slate-800 gap-6 overflow-x-auto pb-px custom-scrollbar">
                            <button @click="currentSubTab = 'staff'"
                                class="pb-3 text-xs font-bold uppercase tracking-wider transition border-b-2 whitespace-nowrap"
                                :class="currentSubTab === 'staff' ? 'text-emerald-600 border-emerald-600 dark:text-emerald-400 dark:border-emerald-400' : 'text-slate-400 border-transparent hover:text-slate-600 dark:hover:text-slate-300'">
                                Staff Directory Registry
                            </button>
                            <button @click="currentSubTab = 'complaints'"
                                class="pb-3 text-xs font-bold uppercase tracking-wider transition border-b-2 whitespace-nowrap"
                                :class="currentSubTab === 'complaints' ? 'text-emerald-600 border-emerald-600 dark:text-emerald-400 dark:border-emerald-400' : 'text-slate-400 border-transparent hover:text-slate-600 dark:hover:text-slate-300'">
                                Live Complaints Queue (<span x-text="complaints.length"></span>)
                            </button>
                            <button @click="currentSubTab = 'feedback'"
                                class="pb-3 text-xs font-bold uppercase tracking-wider transition border-b-2 whitespace-nowrap"
                                :class="currentSubTab === 'feedback' ? 'text-emerald-600 border-emerald-600 dark:text-emerald-400 dark:border-emerald-400' : 'text-slate-400 border-transparent hover:text-slate-600 dark:hover:text-slate-300'">
                                Resident Feedback Reports (<span x-text="feedbackList.length"></span>)
                            </button>
                            <button @click="currentSubTab = 'collection'"
                                class="pb-3 text-xs font-bold uppercase tracking-wider transition border-b-2 whitespace-nowrap"
                                :class="currentSubTab === 'collection' ? 'text-emerald-600 border-emerald-600 dark:text-emerald-400 dark:border-emerald-400' : 'text-slate-400 border-transparent hover:text-slate-600 dark:hover:text-slate-300'">
                                Collection Summaries
                            </button>
                            <button @click="currentSubTab = 'rewards'"
                                class="pb-3 text-xs font-bold uppercase tracking-wider transition border-b-2 whitespace-nowrap"
                                :class="currentSubTab === 'rewards' ? 'text-emerald-600 border-emerald-600 dark:text-emerald-400 dark:border-emerald-400' : 'text-slate-400 border-transparent hover:text-slate-600 dark:hover:text-slate-300'">
                                Reward distributions
                            </button>
                        </div>

                        <!-- TAB: Staff Directory Registry -->
                        <div x-show="currentSubTab === 'staff'" class="space-y-6 animate-fadeIn">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                <div>
                                    <h3
                                        class="text-sm font-bold uppercase tracking-wider text-emerald-950 dark:text-emerald-400">
                                        Staff Registry</h3>
                                    <p class="text-[11px] text-slate-400">Register and manage municipal drivers,
                                        sweepers, and office coordinators.</p>
                                </div>
                                <button @click="openStaffModal()"
                                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-sm">+
                                    Register New Member</button>
                            </div>

                            <div
                                class="bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800 p-3 rounded-2xl flex items-center gap-3">
                                <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                <input type="text" placeholder="Filter directories by name, designation, zone..."
                                    x-model="searchQuery"
                                    class="bg-transparent text-xs w-full focus:outline-none text-slate-800 dark:text-slate-300">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <template x-for="s in getFilteredStaff()" :key="s.id">
                                    <div class="bg-white dark:bg-slate-900 border rounded-2xl p-5 flex flex-col justify-between gap-4 transition"
                                        :class="s.status === 'Active' ? 'border-emerald-100 dark:border-slate-800 bg-[#fbfdfc] dark:bg-slate-900/40' : 'border-slate-200 dark:border-slate-800 opacity-60 bg-slate-50 dark:bg-slate-800/20'">
                                        <div class="flex items-start justify-between gap-4">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <span
                                                        class="text-[9px] font-mono font-bold text-slate-400 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded"
                                                        x-text="s.id"></span>
                                                    <span
                                                        class="text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full"
                                                        :class="s.status === 'Active' ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-400' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400'"
                                                        x-text="s.status"></span>
                                                    <span
                                                        class="text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-400"
                                                        x-text="s.role"></span>
                                                </div>
                                                <h4 class="font-extrabold text-slate-900 dark:text-white text-sm mt-1"
                                                    x-text="s.name"></h4>
                                                <p class="text-xs text-slate-500 dark:text-slate-400 font-semibold"
                                                    x-text="s.designation"></p>
                                                <p class="text-xs text-slate-400 dark:text-slate-500 font-mono"
                                                    x-text="s.emailId"></p>
                                            </div>

                                            <div class="flex items-center gap-1">
                                                <button @click="openStaffModal(s)"
                                                    class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-650 dark:text-slate-400 transition"
                                                    title="Modify Information">
                                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                                        stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2"
                                                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>

                                        <div
                                            class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-400">
                                            <span class="flex items-center gap-1">
                                                <svg class="h-3.5 w-3.5 text-emerald-500" fill="none"
                                                    viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2"

    <!-- AlpineJS Reactive Script Core -->
    <script>
        function portalApp() {
            return {
                darkMode: false,
                user: null, // Holds session user info { name, role, token }
                credentials: {
                    id: '',
                    password: '',
                    passkey: 'adm_pass' // Default to admin portal
                },
                errorMessage: '',
                loading: false,
                showServerConfig: false,
                serverUrl: 'https://ecobin-backend-msxs.onrender.com', // Backend API Server URL (Fallback default)
                toast: {
                    show: false,
                    message: '',
                    type: 'success'
                },

                initPortal() {
                    window.portalAppInstance = this;
                    // Load theme
                    this.darkMode = localStorage.getItem('darkMode') === 'true' ||
                        (!('darkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }

                    // Load saved backend server config URL
                    const savedUrl = localStorage.getItem('ecobin_server_url');
                    if (savedUrl) {
                        this.serverUrl = savedUrl;
                    }

                    // Look for existing session in localStorage
                    const savedSession = localStorage.getItem('ecobin_session');
                    if (savedSession) {
                        try {
                            this.user = JSON.parse(savedSession);
                        } catch (e) {
                            localStorage.removeItem('ecobin_session');
                        }
                    }
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                saveServerUrl() {
                    localStorage.setItem('ecobin_server_url', this.serverUrl);
                    this.showToast(`Server URL configured to ${this.serverUrl}`);
                },

                showToast(message, type = 'success') {
                    this.toast.message = message;
                    this.toast.type = type;
                    this.toast.show = true;
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 4000);
                },

                autoFill(role) {
                    if (role === 'admin') {
                        this.credentials.passkey = 'adm_pass';
                        this.credentials.id = 'admin1';
                        this.credentials.password = 'adminpass';
                    } else {
                        this.credentials.passkey = 'office_pass';
                        this.credentials.id = 'CS-1234';
                        this.credentials.password = 'staffpass';
                    }
                },

                async submitLogin() {
                    this.loading = true;
                    this.errorMessage = '';

                    try {
                        const response = await fetch(`${this.serverUrl}/api/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                userId: this.credentials.id,
                                password: this.credentials.password,
                                passkey: this.credentials.passkey
                            })
                        });

                        if (!response.ok) {
                            const errorText = await response.text();
                            throw new Error(errorText || 'Authentication check failed.');
                        }

                        const data = await response.json();

                        // Parse backend dual role schema mapping
                        if (data.status === 'success') {
                            let role = '';
                            let name = '';

                            if (data.page === 'admin_page') {
                                role = 'ADMIN';
                                name = data.adminName || 'System Administrator';
                            } else if (data.page === 'office_staff_page') {
                                role = 'STAFF';
                                name = data.collection_worker_name || 'Office Coordinator';
                            } else {
                                throw new Error('You do not have portal permissions. Only Admin or Staff are allowed.');
                            }

                            this.user = {
                                name: name,
                                role: role,
                                id: this.credentials.id,
                                passkey: this.credentials.passkey
                            };

                            localStorage.setItem('ecobin_session', JSON.stringify(this.user));
                            this.showToast(`Welcome back, ${name}! Portal sync established.`);
                        } else {
                            throw new Error(data.message || 'Login details incorrect.');
                        }

                    } catch (err) {
                        this.errorMessage = err.message || 'Server connection could not be established.';
                        this.showToast(this.errorMessage, 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                logout() {
                    this.user = null;
                    localStorage.removeItem('ecobin_session');
                    this.credentials.id = '';
                    this.credentials.password = '';
                    this.showToast('Logged out of control systems safely.');
                }
            };
        }

        // Admin dashboard Alpine component context
        function adminDashboard() {
            return {
                currentSubTab: 'staff',
                searchQuery: '',
                staffFormOpen: false,
                isEditMode: false,
                formSaving: false,
                newStaffCredentials: null,
                staffFormError: '',
                hasCollectionData: false,
                totalSchedulesCompleted: 0,
                totalAmountReceived: 0,
                hasRewardData: false,
                totalPointsGiven: 0,
                rewardPayments: [],
                complaints: [],
                feedbackList: [],
                staffForm: {
                    id: '',
                    name: '',
                    role: 'STAFF',
                    designation: '',
                    emailId: '',
                    phoneNumber: '',
                    district: 'Kottayam',
                    localBody: '',
                    ward: 1
                },

                // In-memory staff list initialized with presets (admin registers them live to DB)
                staffList: [],

                periodFilter: 'Weekly',
                collectionData: {
                    Daily: { requests: 42, completed: 39, performance: '92.8%', breakdown: { recyclable: 65, glassMetal: 20, hazardous: 15 } },
                    Weekly: { requests: 284, completed: 271, performance: '95.4%', breakdown: { recyclable: 60, glassMetal: 25, hazardous: 15 } },
                    Monthly: { requests: 1240, completed: 1198, performance: '96.6%', breakdown: { recyclable: 58, glassMetal: 28, hazardous: 14 } }
                },

                rewardStats: {
                    totalPoints: '840,250 PTS',
                    participationRate: '78.4%',
                    vouchersRedeemed: '2,480 Claims',
                    transactions: [
                        { id: 'TX-901', user: 'Alex Mercer', timestamp: '2 minutes ago', points: 150 },
                        { id: 'TX-902', user: 'Rita Roy', timestamp: '1 hour ago', points: 45 },
                        { id: 'TX-903', user: 'Mohan Lal', timestamp: '3 hours ago', points: 100 }
                    ]
                },

                initAdmin() {
                    // Hook into server URLs
                    this.fetchComplaints();
                    this.fetchFeedback();
                    this.fetchStaff();
                    this.fetchCollectionSummaryData();
                    this.fetchRewardSummaryData();
                },

                async fetchCollectionSummaryData() {
                    try {
                        const res = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/schedules?passkey=${window.portalAppInstance.user.passkey || 'adm_pass'}`);
                        const data = res.ok ? await res.json() : {};
                        const schedules = data.schedules || [];

                        const completed = schedules.filter(s => s.status === 'completed' || s.status === 'success');
                        this.totalSchedulesCompleted = completed.length;

                        const resReq = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/immediate-requests`);
                        const reqData = resReq.ok ? await resReq.json() : [];
                        const collectedRequests = reqData.filter(r => r.status === 'collected' || r.status === 'success');

                        let amount = 0;
                        collectedRequests.forEach(r => {
                            amount += (r.paymentAmount || 0);
                        });

                        completed.forEach(s => {
                            amount += (s.amountPerHouse || 50.0);
                        });

                        this.totalAmountReceived = amount;
                        this.hasCollectionData = (this.totalSchedulesCompleted > 0 || this.totalAmountReceived > 0);
                    } catch (e) {
                        console.error(e);
                        this.hasCollectionData = false;
                    }
                },

                async fetchRewardSummaryData() {
                    try {
                        const res = await fetch(`${window.portalAppInstance.serverUrl}/api/payment/all`);
                        const data = res.ok ? await res.json() : {};
                        const payments = data.payments || [];

                        let totalPoints = 0;
                        payments.forEach(p => {
                            totalPoints += (p.pointEarned || 0);
                        });

                        this.totalPointsGiven = totalPoints;
                        this.rewardPayments = payments;
                        this.hasRewardData = (payments.length > 0 && totalPoints > 0);
                    } catch (e) {
                        console.error(e);
                        this.hasRewardData = false;
                    }
                },

                async fetchStaff() {
                    try {
                        const resStaff = await fetch(`${window.portalAppInstance.serverUrl}/api/register/staff/all`);
                        const staffData = resStaff.ok ? await resStaff.json() : [];

                        const resWorkers = await fetch(`${window.portalAppInstance.serverUrl}/api/register/worker/all`);
                        const workerData = resWorkers.ok ? await resWorkers.json() : [];

                        const list = [];

                        staffData.forEach(s => {
                            list.push({
                                id: s.userId,
                                name: s.fullName,
                                role: 'STAFF',
                                designation: s.designation || 'Office Staff',
                                emailId: s.email,
                                phone: s.phoneNo || 'N/A',
                                status: 'Active',
                                district: 'Kottayam',
                                localBody: 'Office'
                            });
                        });

                        workerData.forEach(w => {
                            list.push({
                                id: w.collectionWorkerId,
                                name: w.name,
                                role: 'WORKER',
                                designation: 'Field Collector',
                                emailId: w.emailId,
                                phone: w.phoneNumber || 'N/A',
                                status: 'Active',
                                district: w.district || 'Kottayam',
                                localBody: w.localBodyName || 'Mananam'
                            });
                        });

                        this.staffList = list;
                    } catch (e) {
                        console.error('Failed to fetch staff/workers:', e);
                    }
                },

                getFilteredStaff() {
                    if (!this.searchQuery) return this.staffList;
                    const q = this.searchQuery.toLowerCase();
                    return this.staffList.filter(s =>
                        s.name.toLowerCase().includes(q) ||
                        s.designation.toLowerCase().includes(q) ||
                        s.id.toLowerCase().includes(q) ||
                        s.district.toLowerCase().includes(q) ||
                        s.localBody.toLowerCase().includes(q)
                    );
                },

                openStaffModal(staffObj = null) {
                    this.newStaffCredentials = null;
                    this.staffFormError = '';
                    if (staffObj) {
                        this.isEditMode = true;
                        this.staffForm = {
                            id: staffObj.id,
                            name: staffObj.name,
                            role: staffObj.role,
                            designation: staffObj.designation,
                            emailId: staffObj.emailId,
                            phoneNumber: staffObj.phone,
                            district: staffObj.district,
                            localBody: staffObj.localBody,
                            ward: 1
                        };
                    } else {
                        this.isEditMode = false;
                        this.staffForm = {
                            id: '',
                            name: '',
                            role: 'STAFF',
                            designation: '',
                            emailId: '',
                            phoneNumber: '',
                            district: 'Kottayam',
                            localBody: '',
                            ward: 1
                        };
                    }
                    this.staffFormOpen = true;
                },

                async submitStaffForm() {
                    this.staffFormError = '';

                    // Email validation
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(this.staffForm.emailId)) {
                        this.staffFormError = 'Please enter a valid email address.';
                        return;
                    }

                    // Phone validation
                    const phoneRegex = /^\d{10}$/;
                    if (!phoneRegex.test(this.staffForm.phoneNumber)) {
                        this.staffFormError = 'Phone number must be exactly 10 digits.';
                        return;
                    }

                    this.formSaving = true;
                    this.newStaffCredentials = null;

                    try {
                        const url = this.staffForm.role === 'STAFF'
                            ? `${window.portalAppInstance.serverUrl}/api/register/staff`
                            : `${window.portalAppInstance.serverUrl}/api/register/worker`;

                        const payload = this.staffForm.role === 'STAFF'
                            ? {
                                name: this.staffForm.name,
                                designation: this.staffForm.designation || 'Office Staff',
                                phoneNumber: this.staffForm.phoneNumber,
                                emailId: this.staffForm.emailId
                            }
                            : {
                                name: this.staffForm.name,
                                phoneNumber: this.staffForm.phoneNumber,
                                emailId: this.staffForm.emailId,
                                district: this.staffForm.district,
                                localBodyName: this.staffForm.localBody || 'Municipality',
                                ward: this.staffForm.ward,
                                consent: true
                            };

                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            throw new Error('Registration HTTP status failed.');
                        }

                        const result = await response.json();

                        if (result === "account already exist") {
                            throw new Error('Account credentials already exist in control system database.');
                        }

                        // Save coordinates to memory list
                        const newId = result.collection_worker_id;
                        const genPass = result.password;

                        this.newStaffCredentials = {
                            id: newId,
                            password: genPass
                        };

                        if (this.isEditMode) {
                            const idx = this.staffList.findIndex(s => s.id === this.staffForm.id);
                            if (idx !== -1) {
                                this.staffList[idx] = {
                                    ...this.staffList[idx],
                                    name: this.staffForm.name,
                                    role: this.staffForm.role,
                                    designation: this.staffForm.role === 'STAFF' ? this.staffForm.designation : 'Field Collector',
                                    emailId: this.staffForm.emailId,
                                    phone: this.staffForm.phoneNumber,
                                    district: this.staffForm.district,
                                    localBody: this.staffForm.localBody
                                };
                            }
                        } else {
                            this.staffList.push({
                                id: newId,
                                name: this.staffForm.name,
                                role: this.staffForm.role,
                                designation: this.staffForm.role === 'STAFF' ? this.staffForm.designation : 'Field Collector',
                                emailId: this.staffForm.emailId,
                                phone: this.staffForm.phoneNumber,
                                status: 'Active',
                                district: this.staffForm.district,
                                localBody: this.staffForm.localBody
                            });
                        }

                        window.portalAppInstance.showToast('Staff registered successfully!');
                        this.fetchStaff();

                    } catch (err) {
                        window.portalAppInstance.showToast(err.message || 'Worker registration failed.', 'error');
                    } finally {
                        this.formSaving = false;
                    }
                },

                toggleStaffStatus(id) {
                    const staff = this.staffList.find(s => s.id === id);
                    if (staff) {
                        staff.status = staff.status === 'Active' ? 'Deactivated' : 'Active';
                        window.portalAppInstance.showToast(`Staff Status for ${staff.name} changed to ${staff.status}.`);

        }

        // Office staff dashboard Alpine component context
        function staffWorkspace() {
            return {
                currentSubTab: 'leaves',
                zoningBusy: false,
                zoningStatusText: '',
                schedulingBusy: false,
                assignmentBusy: false,
                otpBusy: false,
                leaveRequests: [],
                complaints: [],
                requests: [],
                schedules: [],
                expenses: [],

                initStaff() {
                    this.fetchLeaveRequests();
                    this.fetchComplaints();
                    this.fetchSchedules();
                    this.fetchRequests();
                    this.fetchExpenses();
                },

                async triggerZoningUpdate() {
                    this.zoningBusy = true;
                    this.zoningStatusText = 'Initializing Zoning Process...';

                    // Start polling for real-time stage status updates
                    const statusInterval = setInterval(async () => {
                        try {
                            const res = await fetch(`${window.portalAppInstance.serverUrl}/api/zone/status`);
                            if (res.ok) {
                                const statusMsg = await res.text();
                                if (statusMsg) {
                                    this.zoningStatusText = statusMsg;
                                }
                            }
                        } catch (e) {
                            // ignore polling errors
                        }
                    }, 100);

                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/zone/check-update`, {
                            method: 'POST'
                        });
                        const data = await response.json();

                        if (data.status === 'success') {
                            window.portalAppInstance.showToast(data.message || 'Zonal allocations completed successfully.');
                        } else if (data.status === 'no_change') {
                            window.portalAppInstance.showToast('All registered households are mapped. No updates needed.', 'success');
                        } else {
                            throw new Error(data.message || 'Zonal optimization failed.');
                        }
                    } catch (e) {
                        window.portalAppInstance.showToast(e.message || 'Connection to zoning system failed.', 'error');
                    } finally {
                        clearInterval(statusInterval);
                        this.zoningBusy = false;
                        this.zoningStatusText = '';
                    }
                },

                async triggerAutoScheduling() {
                    this.schedulingBusy = true;
                    window.portalAppInstance.showToast('Running automated scheduling algorithms...');

                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/auto-generate-all`, {
                            method: 'POST'
                        });
                        const data = await response.json();

                        if (data.status === 'success') {
                            window.portalAppInstance.showToast(data.message || 'Scheduler optimized successfully.');
                            this.fetchSchedules();
                        } else {
                            throw new Error(data.message || 'Automatic scheduling script failed.');
                        }
                    } catch (e) {
                        window.portalAppInstance.showToast(e.message || 'Auto-scheduler pipeline error.', 'error');
                    } finally {
                        this.schedulingBusy = false;
                    }
                },

                async fetchComplaints() {

                async solveComplaint(complaintId) {

                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                complaintId: complaintId,

                            })

                    } catch (e) {
                        window.portalAppInstance.showToast('Deletion failed.', 'error');

                async fetchSchedules() {
                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/schedules?passkey=${window.portalAppInstance.user.passkey}`);
                        if (!response.ok) throw new Error('Schedules fetch failed.');
                        const data = await response.json();
                        if (data.status === 'success') {
                            this.schedules = data.schedules;
                        }
                    } catch (e) {
                        console.error('Schedules Sync Error:', e);
                    }
                },

                async fetchRequests() {
                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/immediate-requests`);
                        if (!response.ok) throw new Error('Requests fetch failed.');
                        const data = await response.json();
                        // Initialize selectedDate, assignedWorkerId, enteredOtp, and availableWorkers on each request
                        this.requests = data.map(req => {
                            return {
                                ...req,
                                selectedDate: '',
                                assignedWorkerId: '',
                                enteredOtp: '',
                                availableWorkers: []
                            };
                        });
                    } catch (e) {
                        console.error('Requests Sync Error:', e);
                    }
                },

                async onDateChanged(reqId, dateStr) {
                    if (!dateStr) return;
                    // dateStr is in YYYY-MM-DD from input. We must convert it to DD-MM-YYYY for our backend
                    const parts = dateStr.split('-');
                    const formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;

                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/available-workers?date=${formattedDate}`);
                        if (!response.ok) throw new Error('Workers fetch failed');
                        const workers = await response.json();
                        // Find the request in our requests list, and attach available workers to it
                        const req = this.requests.find(r => r.id === reqId);
                        if (req) {
                            req.availableWorkers = workers;
                            req.selectedDate = formattedDate;
                        }
                    } catch (e) {
                        window.portalAppInstance.showToast('Failed to fetch available workers: ' + e.message, 'error');
                    }
                },

                async acceptRequest(reqId, selectedWorkerId, selectedDate) {
                    if (!selectedDate) {
                        window.portalAppInstance.showToast('Please select a collection date.', 'error');
                        return;
                    }
                    if (!selectedWorkerId) {
                        window.portalAppInstance.showToast('Please assign a collection worker.', 'error');
                        return;
                    }
                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/immediate-request/accept`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                requestId: reqId,
                                date: selectedDate,
                                workerId: selectedWorkerId
                            })
                        });
                        const data = await response.json();
                        if (data.status === 'success') {
                            window.portalAppInstance.showToast('Pickup request accepted successfully!');
                            this.fetchRequests();
                            this.fetchSchedules();
                        } else {
                            throw new Error(data.message);
                        }
                    } catch (e) {
                        window.portalAppInstance.showToast(e.message || 'Acceptance failed.', 'error');
                    }
                },

                async declineRequest(reqId) {
                    const reason = prompt('Please enter a rejection reason:');
                    if (reason === null) return; // cancelled
                    if (!reason.trim()) {
                        window.portalAppInstance.showToast('Rejection reason is required.', 'error');
                        return;
                    }
                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/immediate-request/decline`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                requestId: reqId,
                                reason: reason.trim()
                            })
                        });
                        const data = await response.json();
                        if (data.status === 'success') {
                            window.portalAppInstance.showToast('Pickup request declined.');
                            this.fetchRequests();
                        } else {
                            throw new Error(data.message);
                        }
                    } catch (e) {
                        window.portalAppInstance.showToast(e.message || 'Rejection failed.', 'error');
                    }
                },

                async verifyOtp(userId, reqId, enteredOtp) {
                    if (!enteredOtp || enteredOtp.trim().length !== 4) {
                        window.portalAppInstance.showToast('Please enter a valid 4-digit OTP.', 'error');
                        return;
                    }
                    try {
                        const response = await fetch(`${window.portalAppInstance.serverUrl}/api/collection/immediate-request/verify-otp`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                houseUserId: userId,
                                otp: enteredOtp.trim(),
                                paymentReceivedAtDoor: false
                            })
                        });
                        const data = await response.json();
                        if (data.status === 'success') {
                            window.portalAppInstance.showToast('OTP verified successfully! Waste collected.');
                            this.fetchRequests();
                        } else {
                            throw new Error(data.message || 'Invalid OTP');
                        }
                    } catch (e) {
                        window.portalAppInstance.showToast(e.message || 'Verification failed.', 'error');
                    }
                }
            };
        }
